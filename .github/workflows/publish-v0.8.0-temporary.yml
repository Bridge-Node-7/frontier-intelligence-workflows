name: publish-v0.8.0-temporary

on:
  push:
    branches:
      - release/v0.8.0-publish

permissions:
  contents: write

concurrency:
  group: publish-v0.8.0-temporary
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 8aaa337d9a808884dbf65d56c89ca075c8a8fc88
      RELEASE_TAG: v0.8.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
          test "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing duplicate publication."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing duplicate publication."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Run FIW release validation
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fiw-validation" "${RUNNER_TEMP}/fiw-release"
          python scripts/run_tests.py --root . --json-output "${RUNNER_TEMP}/fiw-validation/source-test-summary.json"
          python scripts/compile_sources.py --root .
          python scripts/validate_repo.py --root . --json-output "${RUNNER_TEMP}/fiw-validation/validation-report.json"
          python scripts/build_release.py --root . --output-dir "${RUNNER_TEMP}/fiw-release" --check --commit "$EXPECTED_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Create annotated release tag
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message='Frontier Intelligence Workflows v0.8.0 — Source Genealogy' \
            -f object="$EXPECTED_SHA" \
            -f type='commit' \
            --jq .sha)"
          test -n "$tag_sha"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$tag_sha" >/dev/null

      - name: Publish deterministic release assets
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          Frontier Intelligence Workflows v0.8.0 adds Source Genealogy for preserving declared provenance relationships and preventing publication multiplicity from masquerading as independent corroboration.

          The release preserves FIW's evidence-first workflow, deterministic validation, public/private separation, and accountable human decision authority.
          EOF
          gh release create "$RELEASE_TAG" "${RUNNER_TEMP}/fiw-release/"* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Frontier Intelligence Workflows v0.8.0 — Source Genealogy" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag

      - name: Verify published release
        run: |
          set -euo pipefail
          ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.type)"
          test "$ref_type" = "tag"
          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref_sha}" --jq .object.sha)"
          test "$target_sha" = "$EXPECTED_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' | grep -Eq '^[1-9][0-9]*$'
