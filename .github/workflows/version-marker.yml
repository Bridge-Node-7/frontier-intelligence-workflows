name: version-marker

# Durable evidence-only version marker for release-please when skip-github-release
# is true. Creates an annotated git tag only; never creates a GitHub Release.
# Tag push triggers release.yml (contents: read) for evidence artifacts only.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-marker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  annotate-tag:
    if: >
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease: pending')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Need push for annotated tag only
          persist-credentials: true

      - name: Create annotated version tag only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          SHA="${{ github.event.pull_request.merge_commit_sha }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Refusing non-semver VERSION marker: ${TAG}"
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on origin; nothing to do."
            exit 0
          fi

          # Refuse if a GitHub Release already exists for this tag (should not for FIW).
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; refusing duplicate marker work."
            exit 0
          fi

          git config user.name "Bridge-Node-7"
          git config user.email "291729790+Bridge-Node-7@users.noreply.github.com"
          git tag -a "${TAG}" "${SHA}" -m "${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "PASS created annotated tag ${TAG} at ${SHA} (no GitHub Release)."
