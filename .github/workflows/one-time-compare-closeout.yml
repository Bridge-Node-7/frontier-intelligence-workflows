name: One-time compare banner closeout

on:
  push:
    branches:
      - corrective/fiw-cross-platform-final

permissions:
  contents: write

jobs:
  delete-dispositioned-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch after PR disposition
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
