name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nonpublishing evidence build (always true for this workflow; no GitHub Release write perms)"
        type: boolean
        default: true
        required: false
      tag_name:
        description: "Optional annotated tag to check out for evidence (e.g. v0.9.4); empty uses the dispatch ref"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Publication ownership notice
        run: |
          echo "FIW release.yml is evidence-only (contents: read)."
          echo "GitHub Releases are NOT created here; release-please uses skip-github-release."
          echo "Deliberate annotated-tag + asset Release requires Founder-approved policy exception or manual publish."
          echo "dry_run input=${{ github.event.inputs.dry_run || 'n/a' }}"

      - name: Create external evidence directories
        run: |
          mkdir -p "${RUNNER_TEMP}/fiw-validation" "${RUNNER_TEMP}/fiw-release"

      - name: Reconcile tag and VERSION
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          actual="${{ github.event.inputs.tag_name }}"
          if [[ -z "$actual" ]]; then
            actual="${GITHUB_REF_NAME}"
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "Tag ${actual} does not match VERSION (${expected})."
            exit 1
          fi

      - name: Run adversarial regression tests
        run: >-
          python scripts/run_tests.py
          --root .
          --json-output "${RUNNER_TEMP}/fiw-validation/source-test-summary.json"

      - name: Check Python syntax without bytecode
        run: python scripts/compile_sources.py --root .

      - name: Validate repository
        run: >-
          python scripts/validate_repo.py
          --root .
          --json-output "${RUNNER_TEMP}/fiw-validation/validation-report.json"

      - name: Build deterministic release evidence
        run: >-
          python scripts/build_release.py
          --root .
          --output-dir "${RUNNER_TEMP}/fiw-release"
          --check
          --commit "${GITHUB_SHA}"

      - name: Confirm checks did not modify the repository
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontier-intelligence-workflows-release-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/fiw-release/
          if-no-files-found: error
          retention-days: 30
