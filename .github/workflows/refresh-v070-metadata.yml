name: FIW v0.7.0 metadata refresh

on:
  push:
    branches:
      - feat/language-integrity-0.7.0-reconciled

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'FIW v0.7.0 — refresh normalized release metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Refresh, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          mv .github/workflows/refresh-v070-metadata.yml "$tmpdir/"
          git add -A
          python scripts/refresh_release_metadata.py --root .
          python scripts/run_tests.py --root . --json-output "${RUNNER_TEMP}/source-test-summary.json"
          python scripts/compile_sources.py --root .
          python scripts/validate_repo.py --root . --json-output "${RUNNER_TEMP}/validation-report.json"
          python scripts/build_release.py --root . --output-dir "${RUNNER_TEMP}/fiw-v070-release" --check --commit "${GITHUB_SHA}"
          mv "$tmpdir/refresh-v070-metadata.yml" .github/workflows/
          rmdir "$tmpdir"
          git config user.name 'Bridge Node 7'
          git config user.email '291729790+Bridge-Node-7@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'FIW v0.7.0 — refresh normalized release metadata'
          git push origin HEAD:feat/language-integrity-0.7.0-reconciled
