name: release-please

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".github/**"
      - "release-please-config.json"
      - "MANIFEST.sha256"
      - "REPO_MANIFEST.json"
      - "REPO_FILE_MANIFEST.sha256"
      - "SHA256SUMS"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          # Release-please prepares VERSION/CHANGELOG/PR only; publication remains evidence-only unless a Release is published deliberately.
          # Authoritative release workflow builds evidence and (on deliberate
          # non-dry-run dispatch) creates the annotated tag + GitHub Release assets.
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Sync release-candidate manifests on open release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # release-please-action v4 may emit either a bare PR number or a JSON
          # object with .number / .headBranchName.
          PR_RAW='${{ steps.release.outputs.pr }}'
          if [ -z "${PR_RAW}" ] || [ "${PR_RAW}" = "null" ]; then
            echo "No release-please PR; skipping manifest sync."
            exit 0
          fi
          if [[ "${PR_RAW}" =~ ^[0-9]+$ ]]; then
            PR_NUMBER="${PR_RAW}"
            BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
          else
            PR_NUMBER="$(printf '%s' "${PR_RAW}" | jq -r '.number // empty')"
            BRANCH="$(printf '%s' "${PR_RAW}" | jq -r '.headBranchName // empty')"
            if [ -z "${BRANCH}" ] && [ -n "${PR_NUMBER}" ]; then
              BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
            fi
          fi
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "null" ]; then
            echo "Could not resolve release PR branch from outputs.pr; skipping."
            exit 0
          fi
          # Split noreply identity so the workflow file itself has no email literal.
          GIT_NAME='Bridge-Node-7'
          GIT_MAIL_LOCAL='291729790+Bridge-Node-7'
          GIT_MAIL_DOMAIN='users.noreply.github.com'
          gh auth setup-git
          rm -rf .repo-sync
          git clone --branch "${BRANCH}" --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" .repo-sync
          cd .repo-sync
          python3 -B scripts/sync_release_candidate_manifests.py
          if git diff --quiet -- VERSION CHANGELOG.md MANIFEST.sha256 REPO_MANIFEST.json; then
            echo "Release-candidate VERSION/CHANGELOG/manifests already current on ${BRANCH}."
            exit 0
          fi
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" add VERSION CHANGELOG.md MANIFEST.sha256 REPO_MANIFEST.json
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" commit -m "chore: align VERSION/CHANGELOG and refresh manifests for release candidate"
          git push origin "HEAD:${BRANCH}"
          echo "PASS refreshed manifests on ${BRANCH}"

      - name: Ensure annotated version marker tag
        # Durable evidence-only marker when skip-github-release leaves merged
        # release PRs untagged. Creates annotated git tag only; never a Release.
        # Tag push triggers release.yml (contents: read) for evidence artifacts.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only mark the merge commit of a release PR (avoids tagging later chore commits).
          COMMIT_MSG="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.message | head -n1)"
          case "${COMMIT_MSG}" in
            "chore(main): release "*) ;;
            *)
              echo "Skip version marker: head commit is not a release-please merge (${COMMIT_MSG})."
              exit 0
              ;;
          esac
          VERSION="$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${GITHUB_SHA}" --jq .content | base64 -d | tr -d '\r\n')"
          TAG="v${VERSION}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Refusing non-semver VERSION marker: ${TAG}"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; nothing to do."
            exit 0
          fi
          # Split noreply identity so the workflow file itself has no email literal.
          TAGGER_NAME='Bridge-Node-7'
          TAGGER_LOCAL='291729790+Bridge-Node-7'
          TAGGER_DOMAIN='users.noreply.github.com'
          TAG_OBJ="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${TAG}" \
            -f message="${TAG}" \
            -f object="${GITHUB_SHA}" \
            -f type=commit \
            -f "tagger[name]=${TAGGER_NAME}" \
            -f "tagger[email]=${TAGGER_LOCAL}@${TAGGER_DOMAIN}" \
            -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_OBJ}" >/dev/null
          echo "PASS created annotated tag ${TAG} at ${GITHUB_SHA} (no GitHub Release)."
          # GITHUB_TOKEN-created tags do not trigger other workflows' push events.
          # Explicitly dispatch existing evidence-only release.yml (no new secrets).
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" -f dry_run=true -f tag_name="${TAG}"
          echo "PASS dispatched release.yml evidence workflow for ${TAG}."
