name: release-please

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".github/**"
      - "release-please-config.json"
      - "MANIFEST.sha256"
      - "REPO_MANIFEST.json"
      - "REPO_FILE_MANIFEST.sha256"
      - "SHA256SUMS"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          # Release-please prepares VERSION/CHANGELOG/PR only; publication remains evidence-only unless a Release is published deliberately.
          # Authoritative release workflow builds evidence and (on deliberate
          # non-dry-run dispatch) creates the annotated tag + GitHub Release assets.
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Sync release-candidate manifests on open release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_RAW: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          # release-please-action v4 may emit either a bare PR number or a JSON
          # object with .number / .headBranchName.
          if [ -z "${PR_RAW}" ] || [ "${PR_RAW}" = "null" ]; then
            echo "No release-please PR; skipping manifest sync."
            exit 0
          fi
          if [[ "${PR_RAW}" =~ ^[0-9]+$ ]]; then
            PR_NUMBER="${PR_RAW}"
            BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
          else
            PR_NUMBER="$(printf '%s' "${PR_RAW}" | jq -r '.number // empty')"
            BRANCH="$(printf '%s' "${PR_RAW}" | jq -r '.headBranchName // empty')"
            if [ -z "${BRANCH}" ] && [ -n "${PR_NUMBER}" ]; then
              BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
            fi
          fi
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "null" ]; then
            echo "Could not resolve release PR branch from outputs.pr; skipping."
            exit 0
          fi
          # Split noreply identity so the workflow file itself has no email literal.
          GIT_NAME='Bridge-Node-7'
          GIT_MAIL_LOCAL='291729790+Bridge-Node-7'
          GIT_MAIL_DOMAIN='users.noreply.github.com'
          gh auth setup-git
          rm -rf .repo-sync
          git clone --branch "${BRANCH}" --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" .repo-sync
          cd .repo-sync
          python3 -B scripts/sync_release_candidate_manifests.py
          if git diff --quiet -- VERSION CHANGELOG.md MANIFEST.sha256 REPO_MANIFEST.json; then
            echo "Release-candidate VERSION/CHANGELOG/manifests already current on ${BRANCH}."
            exit 0
          fi
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" add VERSION CHANGELOG.md MANIFEST.sha256 REPO_MANIFEST.json
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" commit -m "chore: align VERSION/CHANGELOG and refresh manifests for release candidate"
          git push origin "HEAD:${BRANCH}"
          echo "PASS refreshed manifests on ${BRANCH}"

      - name: Publish packaged release for merged version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT_MSG="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.message | head -n1)"
          case "${COMMIT_MSG}" in
            "chore(main): release "*) ;;
            *)
              echo "Skip publication: head commit is not a release-please merge (${COMMIT_MSG})."
              exit 0
              ;;
          esac

          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          ARCHIVE="frontier-intelligence-workflows-v${VERSION}-source.zip"
          EXPECTED=(
            "ASSET_HASHES.json"
            "${ARCHIVE}"
            "${ARCHIVE}.sha256"
            "MANIFEST.sha256"
            "RELEASE_EVIDENCE.md"
            "REPO_MANIFEST.json"
            "validation-report.json"
          )

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} exists without a GitHub Release."
              exit 1
            fi
            mapfile -t ASSETS < <(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' | LC_ALL=C sort
            )
            mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort)
            if ! diff -u <(printf '%s\n' "${EXPECTED_SORTED[@]}") <(printf '%s\n' "${ASSETS[@]}"); then
              echo "::error::Existing release ${TAG} is incomplete; required FIW release evidence is missing or unexpected."
              exit 1
            fi
            echo "${TAG} already published with complete evidence."
            exit 0
          fi

          python3 -m pip install --disable-pip-version-check -r requirements-validation.txt
          OUT="${RUNNER_TEMP}/fiw-release"
          rm -rf "${OUT}"
          python3 scripts/build_release.py --root . --output-dir "${OUT}" --check --commit "${GITHUB_SHA}"

          TAG_OBJ="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${TAG}" \
            -f message="Frontier Intelligence Workflows ${TAG}" \
            -f object="${GITHUB_SHA}" \
            -f type=commit \
            --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_OBJ}" >/dev/null

          gh release create "${TAG}" "${OUT}"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --latest \
            --title "Frontier Intelligence Workflows ${TAG}" \
            --notes-file "${OUT}/RELEASE_EVIDENCE.md"

          mapfile -t PUBLISHED < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' | LC_ALL=C sort
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${EXPECTED_SORTED[@]}") <(printf '%s\n' "${PUBLISHED[@]}")
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/fiw-hosted" --pattern "${ARCHIVE}*"
          (cd "${RUNNER_TEMP}/fiw-hosted" && sha256sum --check "${ARCHIVE}.sha256")
          echo "PASS published and verified ${TAG} with complete FIW release evidence."
